name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # vitest は node で動く。node:sqlite（>= 22.13）を使うテストがあるため固定する
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      # ブラウザは Playwright のバージョンに紐づくので、それをキーにする
      - name: Resolve Playwright version
        id: playwright
        working-directory: apps/local
        run: |
          version="$(bunx playwright --version | sed 's/^Version //')"
          # 空だとキーが版を含まなくなり、別バージョンのキャッシュを掴んでしまう
          [ -n "$version" ] || { echo "Could not resolve the Playwright version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # cache hit のときは apt も省く: ubuntu ランナーには Chrome / Chromium が
      # 同梱されているので chromium の共有ライブラリは揃っている。
      # 将来イメージから外れたら「ライブラリが無い」で明示的に落ちる
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: apps/local
        run: bun run test:e2e:install -- --with-deps

      - name: E2E tests
        run: bun run test:e2e
