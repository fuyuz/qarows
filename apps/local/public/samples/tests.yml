      minor: "メモ"
    prerequisites: "テスト実行画面を表示中、使い方カードを過ぎていること"
    description: "メモ欄はテストケース単位（環境非依存）。文言を変えると入力欄右下に「保存」が出る。保存すると永続化され、ステータス未入力でもメモだけ保存できる"

  - id: TC-109
    category:
      major: "エクスポート"
      medium: "zip"
      minor: "ダウンロード"
    prerequisites: "tests.yml 読み込み済み"
    description: "ナビメニューまたはプロジェクト詳細から zip をエクスポートでき、中身に tests.yml と results.json が含まれる（ファイル名は {project.id}.zip）"

  - id: TC-110
    category:
      major: "ファイル読み込み"
      medium: "zip"
      minor: "インポート"
    prerequisites: "/projects?project=_new を表示中"
    description: "zip をドロップすると tests.yml / results.json が展開され、通常のファイル取り込みと同様に読み込める（zip 内の yml/json は拡張子で判別）"

  - id: TC-111
    category:
      major: "閲覧"
      medium: "ダッシュボード"
      minor: "集計対象"
    prerequisites: "tests.yml 読み込み済み、セッション開始済み"
    description: "ダッシュボード右上のドロップダウンで「セッションのみ（選択環境）」と「全体（全環境）」を切り替えられ、進捗・大項目別の集計が選択環境のみ / 全環境で再計算される（セッション未設定時はドロップダウンが無効で全体表示）"

  - id: TC-112
    category:
      major: "Team 版"
      medium: "バグ添付"
      minor: "アップロード"
    prerequisites: "Team 版で R2（ATTACHMENTS）設定済み、バグ起票または編集 Dialog を開いている"
    description: "添付欄にファイル選択またはドラッグ&ドロップで画像・動画を追加でき、最大 5 件・1 ファイル 90MB。サポート外形式や超過サイズはアップロード前にエラー表示され送信されない"

  - id: TC-113
    category:
      major: "Team 版"
      medium: "バグ添付"
      minor: "プレビュー"
    prerequisites: "添付付きバグが存在し、バグ画面で表示している"
    description: "バグカードに画像はインライン表示（クリックで原寸を新規タブ表示）、動画はインライン再生できる。動画はシーク（再生位置の変更）が機能する。削除済み添付はプレースホルダ表示になる"

  - id: TC-114
    category:
      major: "Team 版"
      medium: "バグ添付"
      minor: "削除連動"
    prerequisites: "添付付きバグが存在する"
    description: "バグ編集で添付を外して保存すると実体も削除される。起票 Dialog をキャンセルするとアップロード済み添付が削除される。プロジェクト削除で配下の添付が一括削除される"

  - id: TC-115
    category:
      major: "Team 版"
      medium: "バグ添付"
      minor: "zip 往復"
    prerequisites: "添付付きバグのあるプロジェクトを Team 版で表示中"
    description: "zip エクスポートに attachments/<key>.<ext> が同梱され、別（または同一）Team 環境へ zip インポートすると添付が同じキーで復元・表示される。Local 版へのインポートでは添付はスキップされエラーにならない"

  - id: TC-116
    category:
      major: "Team 版"
      medium: "バグ添付"
      minor: "無効時"
    prerequisites: "R2（ATTACHMENTS）バインディングなしの Team 版デプロイ"
    description: "添付 UI（バグ Dialog の添付欄・バグカードの添付表示）が表示されず、その他の機能は通常どおり動作する"

  - id: TC-117
    category:
      major: "Team 版"
      medium: "バグ添付"
      minor: "保存往復"
    prerequisites: "Team 版で R2（ATTACHMENTS）設定済み、添付を付けたバグを起票または編集して保存した直後"
    description: "保存直後にリロードしても添付が残る。別ブラウザで同一プロジェクトを開いても同じ添付が表示され、zip エクスポートにも含まれる"

  - id: TC-118
    category:
      major: "テスト実行"
      medium: "進捗"
      minor: "大規模プロジェクト"
    prerequisites: "サンプル tests.yml の testCases をコピー増殖させて 1000 件以上にしたファイルを読み込み、テスト実行画面 (/run) を表示中（id は重複不可）"
    description: "結果を連続入力しても進捗バーの更新が体感で遅延せず、入力から次のテストへの遷移が引っかからない"

  - id: TC-119
    category:
      major: "プロジェクト"
      medium: "一覧"
      minor: "最終更新の追従"
    prerequisites: "テスト実行画面で結果を1件入力し、その後 /projects へ戻る"
    description: "一覧の最終更新が直前の入力時刻に更新されている（1操作前の古い時刻が残らない）。セッション開始直後もセッションバッジが即座に反映される"

  - id: TC-120
    category:
      major: "Team 版"
      medium: "定義の保持"
      minor: "D1 の tests_yaml"
    prerequisites: |
      コメント・独自のキー順を含む tests.yml を Team 版にアップロードし、テスト結果を1件以上入力した後。
      確認は wrangler d1 execute <DB> --remote --command "select tests_yaml from projects where id='<ID>'" で行う
    description: "結果入力では D1 の tests_yaml が書き換わらず、アップロードしたコメント・キー順・project.version がそのまま残る。テスト定義の編集（定義編集画面での保存、実行画面でのテストケース編集）を行ったときだけ再直列化される"

  - id: TC-121
    category:
      major: "Team 版"
      medium: "バグ添付"
      minor: "削除後の配信停止"
    prerequisites: |
      Team 版で R2（ATTACHMENTS）設定済み。添付付きバグのあるプロジェクトで添付を一度表示
      （= エッジキャッシュに載せる）した後、そのプロジェクトまたは添付を削除する。
      配信レスポンスは immutable なのでブラウザキャッシュを避け、シークレットウィンドウか
      キャッシュ無効化リロードで確認する
    description: "削除後に同じ添付 URL を直接開くと 404 になる。プロジェクト削除・個別の添付削除のどちらでも、また削除を実行した拠点と別の回線・別端末から開いても 404 になる"

  - id: TC-122
    category:
      major: "Team 版"
      medium: "定義編集"
      minor: "競合検知"
    prerequisites: "同一プロジェクトのテスト定義画面を2ブラウザ（別ユーザー）で開き、B 側で未保存の編集をしている"
    description: "A が定義を Apply した後、B が Apply すると上書き確認ダイアログが出る。キャンセルすると保存されず B の編集内容は残り、OK すると B の内容で上書きされる"

  - id: TC-123
    category:
      major: "Team 版"
      medium: "定義編集"
      minor: "未保存編集の保持"
    prerequisites: "テスト定義画面で draft を編集して未保存のまま、別ブラウザで同じプロジェクトを開いている"
    description: "別ブラウザでテスト結果を入力しても編集中の draft が消えない。別ブラウザが定義を Apply した場合も draft は保持され、同期通知が出るだけで内容は失われない"

  - id: TC-124
    category:
      major: "Team 版"
      medium: "定義編集"
      minor: "履歴を汚さない"
    prerequisites: "AI パネルの復元履歴（definition_revisions）を表示できる状態で、TC-122 の競合または不正な YAML の Apply を起こす"
    description: "409 / 400 で保存に失敗した Apply では復元履歴に項目が増えない（成功した Apply のみ履歴に残る）"

  - id: TC-125
    category:
      major: "Team 版"
      medium: "プロジェクト作成"
      minor: "名前のエスケープ"
    prerequisites: |
      Team 版のプロジェクト一覧で「新規作成」を開いている。
      改行入りの名前は単一行 Input では入力できないため curl 等で
      POST /api/projects に {"name": "a\nb"} を直接送って確認する
    description: "引用符・末尾バックスラッシュ・コロン・日本語・1e3 のような数値に見える名前でも tests.yml なしで作成でき、一覧とテスト定義画面に入力した名前がそのまま表示される"

  - id: TC-126
    category:
      major: "ファイル読み込み"
      medium: "zip"
      minor: "上限"
    prerequisites: |
      高圧縮率の zip bomb を用意する（例: 200MB のゼロ埋めファイル 1 本を zip 圧縮すると
      数百 KB になる）。あわせて yml/json を 33 本含む zip と 32 本ちょうどの zip も用意する
    description: "zip bomb は即座にエラー表示され、タブが固まらない（展開前に弾かれる）。33 本の zip も拒否され、32 本ちょうどは正常に取り込める"

  - id: TC-127
    category:
      major: "Team 版"
      medium: "zip インポート"
      minor: "無関係ファイルの混入"
    prerequisites: "添付付きプロジェクトの zip を macOS / Windows で展開し再圧縮して（attachments/ に .DS_Store や Thumbs.db が混ざった状態で）Team 版にインポートする"
    description: "attachments/ 配下の無関係ファイルは無視され、添付と tests.yml / results.json が通常どおり取り込まれる（インポート全体が失敗しない）"

  - id: TC-128
    category:
      major: "ファイル読み込み"
      medium: "results.json"
      minor: "バグのマージ"
    prerequisites: |
      メモ・修正内容・担当者・手順付きのバグを含む results.json をエクスポートし、同じ bug.id を持つが
      それらのフィールドを持たない results.json（別メンバーが最小構成で書き出したもの）を用意する。
      添付（Team 版のみ生成される）は TC-129 で確認する
    description: "マージ後もバグの担当者・手順・期待/実際の値が残る。メモと修正内容は両方が --- 区切りで連結され、同じファイルを2回マージしても増えない。環境は両方の和になる。ステータスは後に取り込んだファイル側になる"

  - id: TC-129
    category:
      major: "Team 版"
      medium: "zip インポート"
      minor: "添付のマージ"
    prerequisites: "添付付きバグのあるプロジェクトを Team 版で zip エクスポートし、同じ bug.id を持つが添付を持たない results.json を用意する"
    description: "results.json をマージしても既存の添付が残り、バグ画面で引き続き表示・再生できる"

  - id: TC-130
    category:
      major: "ファイル読み込み"
      medium: "results.json"
      minor: "不正なキー"
    prerequisites: |
      手書きで "__proto__" をキーに持つ results.json を用意する
      （例: {"projectId":"qarows","results":{"__proto__":{"chrome-desktop":{"status":"OK"}}},"bugs":[]}）。
      あわせて testCases の id に __proto__ を持つ tests.yml も用意する
    description: "どちらもエラーメッセージ付きで読み込みが拒否され、アプリの状態が壊れない（エラー表示のまま操作を続けられる）"

  - id: TC-131
    category:
      major: "Team 版"
      medium: "同期"
      minor: "メッセージ上限"
    prerequisites: |
      Team 版でバグ起票 Dialog を開き、タイトル・手順・期待結果・実際の結果・メモに
      それぞれ日本語で 8000 文字程度（各項目は上限内、合計で 20000 文字超）を貼り付けて保存する
    description: "各項目が上限内であれば、合計が大きくても保存でき、リロード後も内容が残る。1項目が上限（8192文字）を超える場合はその項目のエラーになる"

  - id: TC-132
    category:
      major: "Team 版"
      medium: "エクスポート"
      minor: "添付付き zip"
    prerequisites: "添付付きバグが 20 件以上あるプロジェクトを Team 版で開いている（DevTools の Network タブを開いておく）"
    description: "添付の取得が数件ずつ並行して走り（直列に 1 件ずつ待たない）、完了後の zip に添付がすべて含まれる。圧縮自体は同期処理なので、巨大な動画添付では最後に一瞬固まる"

  - id: TC-133
    category:
      major: "Team 版"
      medium: "セキュリティ"
      minor: "projectId 検証"
    prerequisites: |
      日本語で始まる名前（例「テスト qarows」）で project.id を書いていない tests.yml を
      Team 版にアップロードする。あわせて curl で不正な projectId を直接叩く
    description: "アップロードしたプロジェクトは一覧・実行・削除がすべて正常に動く（英数字の id が振られる）。/api/projects/<不正な id> への直接アクセスは 400 で拒否され、一覧・新規作成は影響を受けない"
